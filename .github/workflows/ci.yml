name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - run: >
          python -m py_compile
          app.py brain_provider.py candidate_brain.py composition_engine.py composition_vision.py
          experience_memory.py flm_bridge.py flm_text_provider.py narrative_provider.py
          server_mechanics.py studio_delta.py agent_profiles.py art_materials.py art_policy.py
          room_theme.py subject_catalog.py zebracns.py zebracns_local.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
