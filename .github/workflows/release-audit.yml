name: Release audit

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
          python -m pip check
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Compile published runtime
        run: >
          python -m py_compile
          app.py brain_provider.py candidate_brain.py composition_engine.py composition_vision.py
          experience_memory.py flm_bridge.py flm_text_provider.py narrative_provider.py
          server_mechanics.py studio_delta.py agent_profiles.py art_materials.py art_policy.py
          room_theme.py subject_catalog.py zebracns.py zebracns_local.py scripts/predeploy_check.py
      - name: Check public source hygiene
        run: python scripts/predeploy_check.py --source-only
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser source tests
        run: npm test
